server {
    listen 80;
    listen [::]:80;
    
    server_name tiemhoanhato.site www.tiemhoanhato.site;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name tiemhoanhato.site www.tiemhoanhato.site;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tiemhoanhato.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiemhoanhato.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Logs
    access_log /var/log/nginx/flowerstore_access.log;
    error_log /var/log/nginx/flowerstore_error.log;
    
    # Client body size limit (for image uploads)
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml image/webp;
    gzip_min_length 1000;
    
    # Image optimization - cache and compress
    location ~* ^/flowerstore/api/image/ {
        proxy_pass http://localhost:8080;
        
        # Cache images for 24 hours
        proxy_cache_valid 200 24h;
        expires 24h;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Static assets - CSS, JS, fonts
    location ~* \.(css|js|woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://localhost:8080;
        
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static images - direct caching
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
        proxy_pass http://localhost:8080;
        
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main application
    location /flowerstore/ {
        proxy_pass http://localhost:8080/flowerstore/;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        
        # HTTP/1.1 for Keep-Alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Root location - redirect to /flowerstore
    location = / {
        return 301 https://$server_name/flowerstore/;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to version control
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}



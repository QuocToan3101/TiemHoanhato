plugins {
    id 'java'
    id 'war'
}

group = 'com.example'
version = '1.0-SNAPSHOT'
description = 'Flower Store Web App'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    compileOnly 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'

    implementation 'javax.servlet:jstl:1.2'
    implementation 'com.mysql:mysql-connector-j:8.0.33'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'commons-fileupload:commons-fileupload:1.5'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.sun.mail:javax.mail:1.6.2'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    implementation 'com.google.apis:google-api-services-oauth2:v2-rev20200213-1.31.0'
    implementation 'com.restfb:restfb:2023.9.0'
    implementation 'org.owasp.encoder:encoder:1.2.3'
    implementation 'org.apache.commons:commons-dbcp2:2.9.0'
    implementation 'com.zaxxer:HikariCP:5.0.1'
    implementation 'net.coobird:thumbnailator:0.4.20'
}

tasks.named('processResources') {
    filteringCharset = 'UTF-8'
}

tasks.named('war') {
    archiveFileName = 'flowerstore.war'
}

tasks.register('deployToTomcat', Copy) {
    dependsOn tasks.named('war')
    from tasks.named('war').get().archiveFile
    into 'D:/xampp/tomcat/webapps'
    rename { 'flowerstore.war' }
}
